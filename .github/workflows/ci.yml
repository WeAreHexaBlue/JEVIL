name: CI

on:
    push:
        branches: [main]
    pull_request:

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    verify:
        runs-on: ubuntu-latest
        env:
            ORIGIN: http://localhost:5173
            BETTER_AUTH_SECRET: ci-only-secret-not-used-anywhere-real
        steps:
            - uses: actions/checkout@v4

            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Generate Worker types
              run: bun run gen

            - name: Type and Svelte check
              run: bun run check

            - name: Unit tests
              run: bun run test

            - name: Apply D1 migration from zero
              run: bun run db:migrate:local

            - name: Build
              run: bun run build

            - name: Verify Worker bundle
              run: bunx wrangler deploy --dry-run
